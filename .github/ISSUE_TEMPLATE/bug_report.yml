name: Bug report
description: The CLI, GitHub Action or Azure DevOps task isn't working as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Don't paste credentials, tokens, tenant IDs, environment URLs, solution names or client
        data: redact them. To report a security vulnerability, don't use this form; follow [SECURITY.md](https://github.com/aidevme/solution-blueprint-ci/blob/main/SECURITY.md).
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - CLI (@aidevme/blueprint-cli)
        - GitHub Action
        - Azure DevOps task
        - Core (@aidevme/blueprint-core)
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The package, action or task version you ran.
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Where did it run?
      options:
        - GitHub Actions
        - Azure Pipelines
        - Another CI system
        - Local machine
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: The output of `node --version`, if you know it.
      placeholder: v20.x
  - type: dropdown
    id: authentication
    attributes:
      label: Authentication
      options:
        - Client secret
        - Workload identity federation (OIDC)
    validations:
      required: true
  - type: dropdown
    id: output
    attributes:
      label: Output affected
      multiple: true
      options:
        - Markdown
        - HTML
        - JSON
        - ZIP
        - None (it failed before export)
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: The behavior you saw.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Command or pipeline step to reproduce
      description: The command you ran, or the workflow or pipeline step (redacted).
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Error messages or the failing part of the run log (redacted).
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: The issue contains no secrets, environment details or client data.
          required: true
