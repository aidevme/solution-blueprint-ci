name: "Repo tooling: bug"
description: For maintainers. A skill, agent, sync script or generated file isn't working as expected.
title: "[Tooling bug]: "
labels: ["bug", "skill"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Don't paste credentials, tokens, tenant IDs or client data — redact them.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - aidevme-diagram-mermaid
        - aidevme-diagram-drawio
        - aidevme-github
        - aidevme-vitepress
        - aidevme-docs-maintenance
        - aidevme-skill-recorder
        - aidevme-skill-creator
        - aidevme-skills-sync
        - aidevme-shared-scripts
        - playwright-cli
        - skill-creator
        - change-reviewer (agent)
        - agent-src/sync (sync.ps1, verify-parity.ps1, manifest)
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: The behavior you saw.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Prompt or command to reproduce
      description: The prompt you gave the agent, or the command you ran.
      render: text
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Relevant output or error
      description: Error messages, sync/parity output, or the agent's response (redacted).
      render: text
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Tool and version, OS, model — e.g. "Claude Code 2.x, Windows 11, Opus" or "VS Code Copilot".
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I ran `pwsh -File agent-src/sync/sync.ps1` and `verify-parity.ps1` before reporting (if relevant).
        - label: The issue contains no secrets or client data.
          required: true
