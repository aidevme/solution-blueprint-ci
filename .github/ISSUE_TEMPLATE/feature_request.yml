name: Feature request
description: Suggest a change to the CLI, GitHub Action, Azure DevOps task or the generated blueprint.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check the roadmap in the [README](https://github.com/aidevme/solution-blueprint-ci#roadmap) first. Don't include client data.
  - type: dropdown
    id: package
    attributes:
      label: Area
      multiple: true
      options:
        - CLI
        - GitHub Action
        - Azure DevOps task
        - Discovery (what the blueprint documents)
        - Analysis (diagrams, risks, scoring)
        - Output (Markdown, HTML, JSON, ZIP)
        - Quality gates
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What should it do? Include example options, inputs or output if you have them.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you use now, or other ways to solve it.
